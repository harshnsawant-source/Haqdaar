# The published documents this corpus was built from.
#
# WHY THEY ARE IN THE REPOSITORY
# ------------------------------
# corpus/partners/*.yaml claims to be extracted from NSFDC's official Channel Partner
# lists rather than typed. Until now that claim rested on eight URLs. NSFDC serves
# these from a path carrying an upload timestamp, so a revised list becomes a NEW URL
# and the old one can simply stop resolving - three of the eight below were already
# re-uploaded in 2026, and one is served from a banners path rather than the channel
# partners path, which is what re-uploading rather than replacing looks like.
#
# A provenance claim that depends on someone else's file still being there is not a
# provenance claim. So the documents are here, and the corpus can be rebuilt from this
# repository alone, with no network.
#
# WHAT THE CHECKSUMS ARE FOR
# --------------------------
# tools/extract_partners.py verifies every sha256 below before it reads a page, and
# refuses to run if one does not match. That is what makes "extracted by script from
# the official lists" a checkable statement rather than a promise: the bytes that
# produced the corpus are the bytes recorded here.
#
# If NSFDC publishes a revision, the checksum will not match and extraction will stop.
# That is the intended behaviour. Re-download, replace the file, update the sha256 and
# retrieved_on here, then re-run the extractor and read the diff.
#
# verified_on records the last date every file here was confirmed byte-identical to
# what the URL served.

