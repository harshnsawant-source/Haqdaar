# Hand-read corrections to the extracted Channel Partner lists.
#
# tools/extract_partners.py builds corpus/partners/*.yaml from NSFDC's published PDFs
# and refuses to guess. These are the records where there is nothing for it to guess
# from, because the source itself has no rule to find:
#
#   NO SEPARATOR. Most rows write "Name, Address". A few write the name and then the
#   address with nothing between them, so the first comma lands inside the address and
#   the bank ends up called "Bank of Maharashtra Head office 'Lok mangal' 1501".
#
#   A COLUMN THAT SLIPPED. In the Regional Rural Banks table, row 23's address is
#   printed after row 24's name, so Meghalaya Rural Bank had no address and J&K
#   Grameen Bank had two, one of them in Shillong.
#
#   A STATE THE ROW NAMES ONLY BY ITS CITY. The script will not turn "Bengaluru" into
#   Karnataka, and it should not: a city-name rule is exactly the kind that is right
#   until it is silently wrong. A person reading the printed address and PIN code can
#   say so, and sign for it. Those entries carry the reason below and are the ones to
#   check first if you are auditing this file.
#
# EVERY ENTRY QUOTES ITS SOURCE. `source_record` is the row as it came out of the PDF,
# so a reviewer can see what was read without opening the document.
#
# EVERY ENTRY NAMES WHAT IT EXPECTS. `expect` is the name the script produced when the
# correction was written. If a later run produces something else, the extractor STOPS
# rather than writing this correction onto whatever row now carries that serial.
#
# Nothing here invents a fact. Every value is present in the source record beside it.

corrections:

  - category: SCA
    serial: 26
    expect: "Mizoram Urban Cooperative Development Bank Ltd. (MUCO Bank) Lawlsawmiliani Building (Top Floor)"
    name: "Mizoram Urban Cooperative Development Bank Ltd. (MUCO Bank)"
    address: "Lawlsawmiliani Building (Top Floor), Zarkawt, Aizwal -796 001."
    reason: "The abbreviation is bracketed in mixed case, so the all-capitals rule did not see it and the cut fell at the first comma, which is inside the address."
    source_record: "Mizoram Mizoram Urban Cooperative Development Bank Ltd. (MUCO Bank) Lawlsawmiliani Building (Top Floor), Zarkawt, Aizwal -796 001."

  - category: SCA
    serial: 36
    expect: "UP Sahkari Gram Vikas Bank Ltd. 10"
    name: "UP Sahkari Gram Vikas Bank Ltd."
    address: "10, Mall Avenue, Lucknow, Uttar Pradesh-226001."
    reason: "The source puts no comma between the bank and its house number, so the cut fell after '10'."
    source_record: "Uttar Pradesh UP Sahkari Gram Vikas Bank Ltd. 10, Mall Avenue, Lucknow, Uttar Pradesh-226001."

  - category: RRB
    serial: 17
    expect: "Madhaya Pradesh Gramin Bank. C21"
    name: "Madhaya Pradesh Gramin Bank"
    address: "C21, Business Park, C21 Square opposite Hotel Radisson Blue, MR-10 Indore- 452010, Madhaya Pradesh"
    reason: "This row ends the name with a full stop where every other row uses a comma, so the cut fell after the building name. The source's spelling of the bank is kept as printed; only the state is filed under its correct spelling."
    source_record: "Madhaya Pradesh Gramin Bank. C21, Business Park, C21 Square opposite Hotel Radisson Blue, MR-10 Indore- 452010, Madhaya Pradesh"

  - category: RRB
    serial: 20
    expect: "West Bengal Gramin Bank Natabar Paul Road"
    name: "West Bengal Gramin Bank"
    address: "Natabar Paul Road, Chatterjee Para More, Tikiapara, Howrah – 711101 (WB)"
    reason: "This row has no comma after the bank, so the street was read as part of the name."
    source_record: "West Bengal Gramin Bank Natabar Paul Road, Chatterjee Para More, Tikiapara, Howrah – 711101 (WB)"

  - category: PSB
    serial: 8
    expect: "Bank of Maharashtra Head office ‘Lok mangal’ 1501"
    name: "Bank of Maharashtra"
    address: "Head office ‘Lok mangal’ 1501, Shivajinagar, Pune-411005 Maharashtra"
    reason: "This row has no comma after the bank, so its head office was read as part of the name."
    source_record: "Bank of Maharashtra Head office ‘Lok mangal’ 1501, Shivajinagar, Pune-411005 Maharashtra"

  - category: NBFC_MFI
    serial: 7
