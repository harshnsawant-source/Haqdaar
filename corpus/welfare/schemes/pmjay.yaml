# VERIFIED against the official source on 2026-08-26.
#
# Source: Press Information Bureau, Government of India, release PRID 1738169,
# "Ayushman Bharat Pradhan Mantri Jan Arogya Yojana (AB-PMJAY)", which carries the
# "Detailed list of criteria for eligibility under AB-PMJAY as per SECC 2011". Read on
# 2026-08-26. nha.gov.in and pmjay.gov.in both serve a script shell or reject automated
# reads, so PIB is the readable official carrier of the same list.
#
# This scheme exists for the REVEAL VERTICAL: it is the "same engine, new corpus" beat
# and the cleanest structural refusal we have. Every criterion is keyed to SECC 2011, a
# fifteen-year-old survey no citizen can look up, so every clause is permanently
# UNKNOWN. Not a bug. The demo.
#
# D3 WAS WRONG AND IS NOW FIXED
# -----------------------------
# The provisional version had D3 as "Households with no adult male member between ages
# 16 to 59". The official wording is "Female headed households with no adult male
# member between age 16 to 59". The missing two words matter more than they look: with
# them, D3 describes Sunita almost exactly, which makes the refusal sharper rather than
# weaker. She plausibly meets it. Plausibly is not provably, and the engine still
# refuses. Anyone rehearsing the refusal beat should quote the corrected wording.
#
# D6 IS GENUINELY ABSENT. The published list runs D1..D5 then D7, confirmed against the
# source on 2026-08-26. The gap is the government's, not a transcription slip. Do not
# "fix" it by inventing a D6.
#
# DELIBERATELY ABSENT
# -------------------
# The eleven urban occupational criteria and the five automatic-inclusion categories
# ("Households without shelter", "Destitute/ living on alms", "Manual scavenger
# families", "Primitive tribal groups", "Legally released bonded labour"). All are
# sourced and were read, but Sunita is rural and every one of them is keyed to the same
# SECC 2011 record, so encoding them would add six more permanently-UNKNOWN clauses and
# change no verdict. They are listed here so the omission is a decision on the record
# rather than an oversight.

scheme_id: pmjay
name: Ayushman Bharat PM-JAY
authority: "National Health Authority, Ministry of Health and Family Welfare"
benefit: "health assurance of up to Rs.5 Lakh per family per year for secondary and tertiary healthcare hospitalizations"
source_url: "https://www.pib.gov.in/PressReleasePage.aspx?PRID=1738169"
retrieved_on: 2026-08-26
verification_status: VERIFIED
verify_note: >-
  Every clause transcribed verbatim from PIB release PRID 1738169, read 2026-08-26. The
  release states no end date for the scheme, so no validity window is encoded. It also
  states "There is no cap on family size, or age or gender", which is why no age or
  household-size clause appears. The urban and automatic-inclusion criteria were read
  and deliberately omitted; see the header.

clause_groups:
  # ANY: a family qualifies on at least one deprivation criterion. Every member is keyed
  # to SECC 2011, so verifiable_from is empty throughout and the group can only ever
  # resolve UNKNOWN. T1 fires; status is UNVERIFIABLE. This is the reveal refusal.
  - group_id: rural-deprivation
    satisfy: ANY
    clauses:
      - clause_id: PMJAY-D1
        clause_text: "D1: Only one room with kucha walls and kucha roof"
        rule_type: external_dataset
        verification_status: VERIFIED
        verify_note: "Verbatim from PIB PRID 1738169, read 2026-08-26."
        note: "Keyed to the SECC 2011 household survey; no citizen document proves it."

      - clause_id: PMJAY-D2
        clause_text: "D2: No adult member between age 16 to 59"
        rule_type: external_dataset
        verification_status: VERIFIED
        verify_note: "Verbatim from PIB PRID 1738169, read 2026-08-26."

      - clause_id: PMJAY-D3
        clause_text: >-
          D3: Female headed households with no adult male member between age 16 to 59
        rule_type: external_dataset
        verification_status: VERIFIED
        verify_note: >-
          Verbatim from PIB PRID 1738169, read 2026-08-26. THIS IS THE ON-STAGE REVEAL
          REFUSAL. The provisional version dropped "Female headed"; the corrected
          wording is what must be quoted in the deck and rehearsed.
        note: >-
          Sunita is a widow living alone, so she is a female-headed household with no
          adult male member and plausibly satisfies this outright. Plausibly is not
          provably: the criterion is settled by her SECC 2011 record, which she cannot
          obtain and neither can we. The engine must not turn a likely yes into a
          stated yes, and the fact that this one so nearly fits is exactly what makes
          the refusal worth showing.

      - clause_id: PMJAY-D4
        clause_text: "D4: Disabled member and no able-bodied adult member"
        rule_type: external_dataset
        verification_status: VERIFIED
        verify_note: "Verbatim from PIB PRID 1738169, read 2026-08-26."

      - clause_id: PMJAY-D5
        clause_text: "D5: SC/ST households"
        rule_type: external_dataset
        verification_status: VERIFIED
        verify_note: >-
          Verbatim from PIB PRID 1738169, read 2026-08-26. This is the SECC household
          classification, NOT the caste certificate the citizen holds. Do not be
          tempted to wire a caste certificate to it: the two answer different questions
          and conflating them would manufacture a proof we do not have.

      - clause_id: PMJAY-D7
        clause_text: >-
          D7: Landless households deriving major part of their income from manual
          casual labour
        rule_type: external_dataset
        verification_status: VERIFIED
        verify_note: >-
          Verbatim from PIB PRID 1738169, read 2026-08-26. D6 is absent from the
          published list; confirmed against the source, the gap is the government's.
