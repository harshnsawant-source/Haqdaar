# VERIFIED against the official source on 2026-08-26.
#
# Source: the Maharashtra Social Justice and Special Assistance Department's own scheme
# page, sjsa.maharashtra.gov.in/en/scheme/indira-gandhi-national-widow-pension-scheme/,
# read on 2026-08-26. The page states the whole rule in one sentence, which is why all
# three clauses below quote the same sentence: the decomposition into machine-readable
# limbs is ours, the words are the state government's.
#
# REVEAL VERTICAL. This is the persona scheme: Sunita is a 60-year-old widow.
#
# THE STACKING RULE IS NOW OFFICIALLY SOURCED
# -------------------------------------------
# The provisional version asserted the stacking relationship from our own team doc. The
# official page states it outright:
#
#   "She is eligible to receive Rs 300/- per month from Central Government under this
#    scheme. She also receives Rs 1200/- per month under State sponsored Sanjay Gandhi
#    Niradhar Anudan Yojana, so total financial assistance of Rs. 1500/- is provided."
#
# So the Rs 1,500 a Maharashtra widow receives is Rs 300 central plus Rs 1,200 state,
# not two independent Rs 1,500 benefits. `stacks_with` is what stops the engine counting
# it twice, and this sentence is the proof to put on the appendix slide if a judge asks
# whether we understand the domain.
#
# THE AGE 80 QUESTION IS UNRESOLVED AND DOES NOT NEED TO BE. The page gives 40 to 79
# and says nothing about what happens at 80. The bound is explicit and verbatim, so the
# clause is verified; what a widow moves to at 80 is a different scheme's rule and is
# simply not in this corpus.

scheme_id: ignwps
name: Indira Gandhi National Widow Pension Scheme
authority: "National Social Assistance Programme, delivered in Maharashtra through the Social Justice and Special Assistance Department"
benefit: "Under this scheme, Rs. 1500 per month is given to each beneficiary."
source_url: "https://sjsa.maharashtra.gov.in/en/scheme/indira-gandhi-national-widow-pension-scheme/"
portal_url: "https://nsap.nic.in/"
filing_office: "the Collector's Office / Tehsildar's Office, Sanjay Gandhi Niradhar Anudan Yojana Branch / Talathi Office"
retrieved_on: 2026-08-26
verification_status: VERIFIED
verify_note: >-
  Clause text transcribed verbatim from the Maharashtra SJSA scheme page, read
  2026-08-26. The page states no end date, so no validity window is encoded. It also
  prints no document list, so the `verifiable_from` entries below reflect standard
  practice rather than the source and are flagged as such on each clause.

stacks_with: [sgnay]

clause_groups:
  - group_id: eligibility
    satisfy: ALL
    clauses:
      - clause_id: IGNWPS-C1
        clause_text: >-
          A widow in age group of 40 to 79 years whose family falls under Below Poverty
          Line is eligible under this Scheme.
        rule_type: enumerated_category
        profile_field: applicant.marital_status
        bound:
          values: [WIDOW]
        verifiable_from: [husband_death_certificate]
        verification_status: VERIFIED
        verify_note: >-
          Verbatim from the SJSA page, read 2026-08-26. The widowhood limb of the
          sentence. The page names no proof document; a death certificate reflects
          standard practice and the office may accept others.

      - clause_id: IGNWPS-C2
        clause_text: >-
          A widow in age group of 40 to 79 years whose family falls under Below Poverty
          Line is eligible under this Scheme.
        rule_type: numeric_bound
        profile_field: applicant.age
        bound:
          min: 40
          max: 79
        verifiable_from: [aadhaar, age_proof]
        verification_status: VERIFIED
        verify_note: >-
          Verbatim from the SJSA page, read 2026-08-26. The age limb. Both bounds are
          stated explicitly on the page, so 79 is the source's number and not ours.

      - clause_id: IGNWPS-C3
        clause_text: >-
          A widow in age group of 40 to 79 years whose family falls under Below Poverty
          Line is eligible under this Scheme.
        rule_type: enumerated_category
        profile_field: household.bpl
        bound:
          values: ["true"]
        verifiable_from: [bpl_ration_card]
        verification_status: VERIFIED
        verify_note: >-
          Verbatim from the SJSA page, read 2026-08-26. The BPL limb, and note it is an
          AND here: unlike SGNAY, this scheme offers no income-ceiling alternative. The
          page names no proof document, so the BPL ration card reflects standard
          practice. This clause carries the "one document away" beat, so if the office
          in fact accepts a different proof, this is the line to correct first.
