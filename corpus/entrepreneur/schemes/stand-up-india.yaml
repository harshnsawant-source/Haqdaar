# PROVISIONAL — DO NOT DEMO, DO NOT SLIDE.
#
# Every clause below is a paraphrase taken from PROJECT-BRIEF-ADDENDUM.md s3, which is
# our own team document, not an official source. It exists so the evaluator and the
# first golden tests are runnable on day 1. Replace clause_text with verbatim wording
# from the official page, then flip verification_status to VERIFIED.
#
# Clauses whose exact figures we could not source are ABSENT rather than guessed.
# See verify_note on the scheme.

scheme_id: stand-up-india
name: Stand-Up India
authority: "[VERIFY AT SOURCE] Department of Financial Services, Ministry of Finance"
benefit: "[VERIFY AT SOURCE] Bank loan between Rs 10 lakh and Rs 1 crore for a greenfield enterprise"
source_url: "https://www.standupmitra.in/"
retrieved_on: 2026-08-21
verification_status: PROVISIONAL
verify_note: >-
  Nobody on the team has opened the official Stand-Up India scheme page yet. Confirm:
  (a) the verbatim eligibility wording, (b) whether the SC/ST-or-woman test and the
  greenfield test are separate conditions, (c) the exact loan range and whether it is
  an eligibility bound at all or a product limit, and (d) the full exclusion list,
  which is deliberately NOT encoded here because we could not source it.

clause_groups:
  # ANY group: the applicant qualifies through either route. This is also the day-1
  # exercise of ANY semantics, which PM-JAY (D1..D7) will need in the reveal vertical.
  - group_id: applicant-category
    satisfy: ANY
    clauses:
      - clause_id: SUI-C1
        clause_text: >-
          [VERIFY AT SOURCE] The applicant belongs to a Scheduled Caste or Scheduled
          Tribe.
        rule_type: enumerated_category
        profile_field: applicant.social_category
        bound:
          values: [SC, ST]
        verifiable_from: [caste_certificate]
        verification_status: PROVISIONAL
        verify_note: "Confirm verbatim wording and the accepted proof document."

      - clause_id: SUI-C2
        clause_text: "[VERIFY AT SOURCE] The applicant is a woman."
        rule_type: enumerated_category
        profile_field: applicant.gender
        bound:
          values: [FEMALE]
        verifiable_from: [aadhaar]
        verification_status: PROVISIONAL
        verify_note: "Confirm verbatim wording and the accepted proof document."

  - group_id: enterprise-conditions
    satisfy: ALL
    clauses:
      - clause_id: SUI-C3
        clause_text: >-
          [VERIFY AT SOURCE] The loan is for a greenfield enterprise, that is the
          applicant's first venture in the manufacturing, services, trading or
          allied agricultural sector.
        rule_type: enumerated_category
        profile_field: enterprise.venture_type
        bound:
          values: [GREENFIELD]
        verifiable_from: [project_report, self_declaration]
        verification_status: PROVISIONAL
        verify_note: >-
          Confirm the verbatim definition of greenfield and which document evidences
          it. A self-declaration may not be acceptable proof.

      - clause_id: SUI-C4
        clause_text: >-
          [VERIFY AT SOURCE] The loan amount sought is between Rs 10 lakh and
          Rs 1 crore.
        rule_type: numeric_bound
        profile_field: enterprise.loan_amount_sought
        bound:
          min: 1000000
          max: 10000000
        verifiable_from: [project_report]
        verification_status: PROVISIONAL
        verify_note: >-
          Confirm whether this range is an eligibility condition or merely the
          product's sanction limit. If it is a product limit it does not belong in an
          eligibility group at all.
