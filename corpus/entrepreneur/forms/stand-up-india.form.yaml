# STAND-IN FORM — NOT THE OFFICIAL DOCUMENT. DO NOT PRESENT AS ONE.
#
# The real blank Stand-Up India application PDF is a CONTENT-LANE DEPENDENCY that has
# not landed. This file is a representative layout so the action layer is buildable and
# demonstrable; it is not a transcription of a government form, and nothing here should
# be read as a statement about what the government requires.
#
# Consequences, enforced by engine/haqdaar/corpus/forms.py:
#   * every label carries [VERIFY AT SOURCE]
#   * every field's requirement is UNVERIFIED — we have not read the official form, so
#     we do not know which fields are mandatory, and guessing would be inventing a
#     government requirement
#
# The field set is deliberately modest: the identity, contact, enterprise and banking
# details any loan application would collect. Where the engine cannot fill a field from
# the citizen's documents, it goes in the GAP LIST rather than being invented.
#
# TO PROMOTE THIS TO THE REAL FORM:
#   1. Obtain the official blank PDF from https://www.standupmitra.in/
#   2. Transcribe each field's exact label, marker removed
#   3. Set the true requirement (REQUIRED / OPTIONAL) per the form
#   4. Set is_stand_in: false and verification_status: VERIFIED
#   5. Run the tests — the golden action test will fail because labels changed. Read
#      every diff before updating it. That failure is the system working.

form_id: stand-up-india-application
scheme_id: stand-up-india
title: "[VERIFY AT SOURCE] Stand-Up India loan application"
source_url: "https://www.standupmitra.in/"
retrieved_on: 2026-08-21
is_stand_in: true
verification_status: PROVISIONAL
verify_note: >-
  Nobody has obtained the official blank application form. Every label and every
  requirement below is a placeholder. Replace with the real form before any demo that
  shows a filled application, and say "stand-in" out loud if it is shown before then.

sections:
  - section_id: applicant
    title: "[VERIFY AT SOURCE] Applicant details"
    fields:
      - field_id: applicant_name
        label: "[VERIFY AT SOURCE] Full name of applicant"
        obtainable_from: [aadhaar]
        note: "Not in the day-1 profile schema; arrives with day 6 extraction."

      - field_id: applicant_social_category
        label: "[VERIFY AT SOURCE] Social category (SC / ST / other)"
        profile_field: applicant.social_category
        obtainable_from: [caste_certificate]

      - field_id: applicant_gender
        label: "[VERIFY AT SOURCE] Gender"
        profile_field: applicant.gender
        obtainable_from: [aadhaar]

      - field_id: applicant_date_of_birth
        label: "[VERIFY AT SOURCE] Date of birth"
        obtainable_from: [aadhaar]

      - field_id: applicant_aadhaar_number
        label: "[VERIFY AT SOURCE] Aadhaar number"
        obtainable_from: [aadhaar]
        note: >-
          Deliberately NOT wired to a profile field. Haqdaar does not hold or transmit
          Aadhaar numbers; the citizen writes this on the form themselves.

  - section_id: contact
    title: "[VERIFY AT SOURCE] Contact"
    fields:
      - field_id: applicant_address
        label: "[VERIFY AT SOURCE] Residential address"
        obtainable_from: [aadhaar, domicile_certificate]

      - field_id: applicant_mobile
        label: "[VERIFY AT SOURCE] Mobile number"
        obtainable_from: []

  - section_id: enterprise
    title: "[VERIFY AT SOURCE] Proposed enterprise"
    fields:
      - field_id: enterprise_venture_type
        label: "[VERIFY AT SOURCE] Nature of venture (greenfield / existing)"
        profile_field: enterprise.venture_type
        obtainable_from: [project_report, self_declaration]

      - field_id: enterprise_name
        label: "[VERIFY AT SOURCE] Name of the proposed enterprise"
        obtainable_from: [project_report]

      - field_id: enterprise_sector
        label: "[VERIFY AT SOURCE] Sector (manufacturing / services / trading / allied agriculture)"
        obtainable_from: [project_report]

      - field_id: enterprise_loan_amount_sought
        label: "[VERIFY AT SOURCE] Loan amount sought (Rs)"
        profile_field: enterprise.loan_amount_sought
        obtainable_from: [project_report]

      - field_id: enterprise_project_cost
        label: "[VERIFY AT SOURCE] Total project cost (Rs)"
        obtainable_from: [project_report]

  - section_id: banking
    title: "[VERIFY AT SOURCE] Bank account for disbursal"
    fields:
      - field_id: bank_account_number
        label: "[VERIFY AT SOURCE] Bank account number"
        obtainable_from: [bank_passbook]

      - field_id: bank_ifsc
        label: "[VERIFY AT SOURCE] IFSC code"
        obtainable_from: [bank_passbook]
