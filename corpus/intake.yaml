# Guided intake — the front door.
#
# Structured questions, not a free-text box and not a model. A blank box asks a citizen
# to guess what the machine wants; a low-literacy user in particular does far better
# with "are you a widow? yes / no" than with "describe your situation". It also keeps
# the zero-generative-call guarantee intact: nothing here is interpreted, only recorded.
#
# WHAT AN ANSWER IS WORTH
# -----------------------
# An answer is a SELF-DECLARATION. It settles a clause only where the corpus says a
# self-declaration settles it (`verifiable_from` contains self_declaration) — that is
# how the real PM-KISAN form collects its exclusions, on the applicant's own account.
#
# A clause that needs a caste certificate, a BPL card or a 7/12 extract is NOT settled
# by someone saying so. It stays UNKNOWN and lands on BLOCKED_ON_DOCUMENT. The engine
# enforces this in eligibility/evaluate.py by checking evidence provenance against
# `verifiable_from`; nothing here can override it.
#
# A declaration can also RULE A SCHEME OUT even where it cannot rule one in. You do not
# need a death certificate to establish that you are not a widow. So a stated fact that
# FAILS a clause records FALSE; one that would SATISFY it stays UNKNOWN until the
# document arrives.
#
# The last section asks which documents she actually holds. That is routing only — it
# tells the UI which papers she could upload next. It is never evidence: saying you have
# a caste certificate is not evidence of what the certificate says.
#
# TRANSLATION: every prompt and label carries `mr` and `hi` values.
#
# STATUS: DRAFTED 2026-08-26, AWAITING NATIVE-SPEAKER REVIEW. These are a first
# pass, not verified translations. `docs/TRANSLATION-REVIEW.md` is the sheet for
# checking them line by line. A mistranslated question changes what a citizen
# answers, which changes her verdict, so this is not cosmetic.

version: 1

# NEED-BASED ENTRY. The front door in the citizen's own words rather than ours.
#
# She does not arrive thinking "I need the welfare vertical". She arrives thinking "my
# husband died and there is no money coming in". Each need routes to the vertical whose
# corpus can answer it, so this is a routing table with human words on it, not a second
# taxonomy to keep in sync.
#
# A need names NO schemes. Naming one before the evaluator has seen a single fact would
# be exactly the guess this project refuses, and it is how a "recommendation" quietly
# becomes a promise.
#
# Adding a need is a content change. Adding a vertical it points at is a corpus folder.
# Neither is a code change.
needs:
  - need_id: start-a-business
    vertical: entrepreneur
    answers:
      venture_type: GREENFIELD
    label:
      en: "I want to start or grow a business"
      mr: "मला व्यवसाय सुरू करायचा आहे किंवा वाढवायचा आहे"
      hi: "मैं व्यवसाय शुरू करना या बढ़ाना चाहता हूं"

  - need_id: business-capital
    vertical: entrepreneur
    label:
      en: "I need money or a loan for my work"
      mr: "माझ्या कामासाठी मला पैसे किंवा कर्ज हवे आहे"
      hi: "मुझे अपने काम के लिए पैसे या कर्ज़ चाहिए"

  - need_id: widowed
    vertical: welfare
    # She has just told us she is a widow. Asking again on the next screen is the
    # machine forgetting, which is the behaviour this product exists to replace.
    answers:
      marital_status: WIDOW
    label:
      en: "My husband has died and I have no income"
      mr: "माझे पती वारले आहेत आणि माझ्याकडे उत्पन्न नाही"
      hi: "मेरे पति का निधन हो गया है और मेरी कोई आय नहीं है"

  - need_id: farm-support
    vertical: welfare
    label:
      en: "I farm my own land and need support"
      mr: "मी माझ्या स्वतःच्या जमिनीत शेती करतो आणि मला मदत हवी आहे"
      hi: "मैं अपनी ज़मीन पर खेती करता हूं और मुझे सहायता चाहिए"

  - need_id: old-age-or-health
    vertical: welfare
    label:
      en: "I am older, or I need help with medical costs"
      mr: "माझे वय झाले आहे, किंवा मला वैद्यकीय खर्चासाठी मदत हवी आहे"
      hi: "मेरी उम्र हो गई है, या मुझे इलाज के खर्च में मदद चाहिए"

  - need_id: school-fees
    vertical: student
    label:
      en: "I am at school and my family cannot afford the costs"
      mr: "मी शाळेत आहे आणि माझ्या कुटुंबाला खर्च परवडत नाही"
      hi: "मैं स्कूल में हूं और मेरा परिवार खर्च नहीं उठा सकता"

  - need_id: college-fees
    vertical: student
    label:
      en: "I have a college place and need help paying for it"
      mr: "मला महाविद्यालयात प्रवेश मिळाला आहे आणि फी भरण्यासाठी मदत हवी आहे"
      hi: "मुझे कॉलेज में दाखिला मिला है और फीस भरने में मदद चाहिए"

sections:
  # `verticals` says which domains a section belongs to. Shared sections list both.
  # Declared here rather than split in Python or JSX so the question set stays data.
  - section_id: about-you
    verticals: [entrepreneur, welfare, student]
    title:
      en: "About you"
      mr: "तुमच्याबद्दल"
      hi: "आपके बारे में"
    questions:
      - question_id: age
        profile_field: applicant.age
        type: number
        min: 0
        max: 120
        prompt:
          en: "How old are you?"
          mr: "तुमचे वय किती आहे?"
          hi: "आपकी उम्र कितनी है?"

      - question_id: gender
        profile_field: applicant.gender
        type: choice
        prompt:
          en: "What is your gender?"
          mr: "तुमचे लिंग काय आहे?"
          hi: "आपका लिंग क्या है?"
        options:
          - value: FEMALE
            label: {en: "Woman", mr: "स्त्री", hi: "महिला"}
          - value: MALE
            label: {en: "Man", mr: "पुरुष", hi: "पुरुष"}
          - value: TRANSGENDER
            label: {en: "Transgender", mr: "तृतीयपंथी", hi: "ट्रांसजेंडर"}

      - question_id: marital_status
        profile_field: applicant.marital_status
        type: choice
        prompt:
          en: "What is your marital status?"
          mr: "तुमची वैवाहिक स्थिती काय आहे?"
          hi: "आपकी वैवाहिक स्थिति क्या है?"
        options:
          - value: WIDOW
            label: {en: "Widowed", mr: "विधवा", hi: "विधवा"}
          - value: DIVORCED
            label: {en: "Divorced", mr: "घटस्फोटित", hi: "तलाकशुदा"}
          - value: MARRIED
            label: {en: "Married", mr: "विवाहित", hi: "विवाहित"}
          - value: UNMARRIED
            label: {en: "Unmarried", mr: "अविवाहित", hi: "अविवाहित"}

      - question_id: social_category
        profile_field: applicant.social_category
        type: choice
        prompt:
          en: "What is your social category?"
          mr: "तुमचा सामाजिक प्रवर्ग कोणता आहे?"
          hi: "आपका सामाजिक वर्ग कौन सा है?"
        options:
          - value: SC
            label: {en: "Scheduled Caste", mr: "अनुसूचित जाती", hi: "अनुसूचित जाति"}
          - value: ST
            label: {en: "Scheduled Tribe", mr: "अनुसूचित जमाती", hi: "अनुसूचित जनजाति"}
          - value: OBC
            label: {en: "OBC", mr: "इतर मागास प्रवर्ग", hi: "अन्य पिछड़ा वर्ग"}
          - value: GENERAL
            label: {en: "General", mr: "खुला प्रवर्ग", hi: "सामान्य वर्ग"}

  - section_id: household
    verticals: [welfare]
    title:
      en: "Your household"
      mr: "तुमचे कुटुंब"
      hi: "आपका परिवार"
    questions:
      - question_id: landholding
        profile_field: household.landholding_hectares
        type: number
        min: 0
        max: 1000
        prompt:
          en: "How much cultivable land is in your name, in hectares?"
          mr: "तुमच्या नावावर किती लागवडीयोग्य जमीन आहे, हेक्टरमध्ये?"
          hi: "आपके नाम पर कितनी कृषि योग्य भूमि है, हेक्टेयर में?"

      - question_id: annual_income
        profile_field: household.annual_income
        type: number
        min: 0
        max: 100000000
        prompt:
          en: "What is your family's total income for a year, in rupees?"
          mr: "तुमच्या कुटुंबाचे वार्षिक एकूण उत्पन्न किती आहे, रुपयांमध्ये?"
          hi: "आपके परिवार की वार्षिक कुल आय कितनी है, रुपयों में?"

      - question_id: bpl
        profile_field: household.bpl
        type: boolean
        prompt:
          en: "Is your family on the Below Poverty Line list?"
          mr: "तुमचे कुटुंब दारिद्र्यरेषेखालील यादीत आहे का?"
          hi: "क्या आपका परिवार गरीबी रेखा से नीचे की सूची में है?"

  - section_id: enterprise
    verticals: [entrepreneur]
    title:
      en: "If you are starting a business"
      mr: "तुम्ही व्यवसाय सुरू करत असाल तर"
      hi: "यदि आप व्यवसाय शुरू कर रहे हैं"
    questions:
      - question_id: venture_type
        profile_field: enterprise.venture_type
        type: choice
        prompt:
          en: "Is this your first business?"
          mr: "हा तुमचा पहिला व्यवसाय आहे का?"
          hi: "क्या यह आपका पहला व्यवसाय है?"
        options:
          - value: GREENFIELD
            label: {en: "Yes, my first", mr: "होय, हा माझा पहिला", hi: "हां, यह मेरा पहला है"}
          - value: EXISTING
            label: {en: "No, I already run one", mr: "नाही, मी आधीच एक चालवतो", hi: "नहीं, मैं पहले से एक चला रहा हूं"}

      - question_id: loan_amount
        profile_field: enterprise.loan_amount_sought
        type: number
        min: 0
        max: 1000000000
        prompt:
          en: "How much do you need to borrow, in rupees?"
          mr: "तुम्हाला किती कर्ज हवे आहे, रुपयांमध्ये?"
          hi: "आपको कितना कर्ज़ चाहिए, रुपयों में?"

  # These are the questions a real form collects on the applicant's own account, which
  # is why a declaration settles them. Every one is a PM-KISAN exclusion, and section
  # 4.2 of the scheme's Operational Guidelines is what authorises settling them this
  # way: "State / UT Governments can certify the eligibility of the beneficiaries based
  # on self declaration by the beneficiaries."
  #
  # DO NOT SIMPLIFY THE GOVERNMENT-EMPLOYEE OR PENSION PROMPTS. Both official exclusions
  # end with "(Excluding Multi Tasking Staff / Class IV / Group D employees)". The
  # evaluator cannot express "excluded unless Class IV", so the exception is carried in
  # the question wording instead. Shortening either prompt back to the obvious phrasing
  # silently disqualifies the lowest-paid government workers in the country, which is
  # the exact opposite of what this scheme and this project are for.
  - section_id: declarations
    verticals: [welfare]
    title:
      en: "A few things to declare"
      mr: "काही गोष्टी जाहीर करायच्या आहेत"
      hi: "कुछ बातें घोषित करनी हैं"
    questions:
      - question_id: paid_income_tax
        profile_field: applicant.paid_income_tax
        type: boolean
        prompt:
          en: "Did you pay income tax last year?"
          mr: "तुम्ही मागील वर्षी आयकर भरला होता का?"
          hi: "क्या आपने पिछले वर्ष आयकर भरा था?"

      - question_id: government_employee
        profile_field: applicant.government_employee
        type: boolean
        prompt:
          en: "Are you, or were you, a government employee, other than Multi Tasking Staff, Class IV or Group D?"
          mr: "मल्टी टास्किंग स्टाफ, वर्ग चार किंवा गट ड वगळता, तुम्ही सरकारी कर्मचारी आहात किंवा होता का?"
          hi: "मल्टी टास्किंग स्टाफ, वर्ग चार या समूह घ को छोड़कर, क्या आप सरकारी कर्मचारी हैं या रह चुके हैं?"

      - question_id: constitutional_post
        profile_field: applicant.constitutional_post
        type: boolean
        prompt:
          en: "Have you held a constitutional post, or been a minister, legislator, mayor or district panchayat chairperson?"
          mr: "तुम्ही घटनात्मक पद भूषवले आहे का, किंवा मंत्री, आमदार खासदार, महापौर अथवा जिल्हा पंचायत अध्यक्ष राहिला आहात का?"
          hi: "क्या आपने कोई संवैधानिक पद संभाला है, या मंत्री, विधायक सांसद, महापौर अथवा जिला पंचायत अध्यक्ष रहे हैं?"

      - question_id: registered_professional
        profile_field: applicant.registered_professional
        type: boolean
        prompt:
          en: "Are you a practising doctor, engineer, lawyer, chartered accountant or architect registered with a professional body?"
          mr: "तुम्ही व्यावसायिक संस्थेकडे नोंदणीकृत आणि प्रत्यक्ष व्यवसाय करणारे डॉक्टर, अभियंता, वकील, सनदी लेखापाल किंवा वास्तुविशारद आहात का?"
          hi: "क्या आप किसी व्यावसायिक संस्था में पंजीकृत और प्रैक्टिस करने वाले डॉक्टर, इंजीनियर, वकील, चार्टर्ड अकाउंटेंट या वास्तुकार हैं?"

      - question_id: institutional_landholder
        profile_field: household.institutional_landholder
        type: boolean
        prompt:
          en: "Is the land held by an institution rather than by a person?"
          mr: "जमीन एखाद्या व्यक्तीच्या नावे नसून संस्थेच्या नावे आहे का?"
          hi: "क्या ज़मीन किसी व्यक्ति के बजाय किसी संस्था के नाम है?"

      - question_id: monthly_pension
        profile_field: applicant.monthly_pension
        type: number
        min: 0
        max: 10000000
        prompt:
          en: "Pension from service other than Multi Tasking Staff, Class IV or Group D: how much do you receive each month, in rupees?"
          mr: "मल्टी टास्किंग स्टाफ, वर्ग चार किंवा गट ड वगळता इतर सेवेतून मिळणारे निवृत्तिवेतन: तुम्हाला दरमहा किती मिळते, रुपयांमध्ये?"
          hi: "मल्टी टास्किंग स्टाफ, वर्ग चार या समूह घ को छोड़कर अन्य सेवा से मिलने वाली पेंशन: आपको हर महीने कितनी मिलती है, रुपयों में?"

  # STUDENT VERTICAL, added 2026-08-26. Both schemes it serves belong to the Ministry of
  # Social Justice & Empowerment, the same ministry as problem statement SIH26092.
  - section_id: study
    verticals: [student]
    title:
      en: "About your studies"
      mr: "तुमच्या शिक्षणाबद्दल"
      hi: "आपकी पढ़ाई के बारे में"
    questions:
      - question_id: class_level
        profile_field: student.class_level
        type: number
        min: 1
        max: 12
        prompt:
          en: "Which class are you in at school? Leave this blank if you have finished school."
          mr: "तुम्ही शाळेत कोणत्या इयत्तेत आहात? शाळा पूर्ण झाली असल्यास हे रिकामे ठेवा."
          hi: "आप स्कूल में किस कक्षा में हैं? यदि स्कूल पूरा हो चुका है तो इसे खाली छोड़ दें."

      - question_id: school_recognised
        profile_field: student.school_recognised
        type: boolean
        prompt:
          en: "Are you a regular, full time student at a government school, or a school recognised by the government or a Central or State Board?"
          mr: "तुम्ही सरकारी शाळेत, किंवा शासनमान्य अथवा केंद्रीय वा राज्य मंडळाची मान्यता असलेल्या शाळेत नियमित पूर्णवेळ विद्यार्थी आहात का?"
          hi: "क्या आप किसी सरकारी स्कूल में, या सरकार अथवा केंद्रीय या राज्य बोर्ड से मान्यता प्राप्त स्कूल में नियमित पूर्णकालिक विद्यार्थी हैं?"

      - question_id: admission_secured
        profile_field: student.admission_secured
        type: boolean
        prompt:
          en: "Have you secured admission to a full time course at a college or institution?"
          mr: "तुम्हाला महाविद्यालयात किंवा संस्थेत पूर्णवेळ अभ्यासक्रमासाठी प्रवेश मिळाला आहे का?"
          hi: "क्या आपको किसी कॉलेज या संस्थान में पूर्णकालिक पाठ्यक्रम में दाखिला मिल गया है?"

      - question_id: year_of_study
        profile_field: student.year_of_study
        type: number
        min: 1
        max: 10
        prompt:
          en: "Which year of that course are you in?"
          mr: "तुम्ही त्या अभ्यासक्रमाच्या कितव्या वर्षात आहात?"
          hi: "आप उस पाठ्यक्रम के कौन से वर्ष में हैं?"

      # DO NOT SIMPLIFY. The official exclusion carves out the National Means-cum-Merit
      # scholarship inside the same sentence, and the evaluator cannot say "excluded
      # unless it is NMMS". Shortening this to "any other scholarship" would disqualify
      # students the scheme explicitly allows. Same pattern as the PM-KISAN Class IV
      # exception in the declarations section.
      - question_id: other_central_prematric_scholarship
        profile_field: student.other_central_prematric_scholarship
        type: boolean
        prompt:
          en: "Are you receiving another centrally funded pre-matric scholarship, other than the National Means-cum-Merit scholarship?"
          mr: "राष्ट्रीय आर्थिक दुर्बल घटक गुणवत्ता शिष्यवृत्ती वगळता, तुम्हाला केंद्र पुरस्कृत दुसरी मॅट्रिकपूर्व शिष्यवृत्ती मिळते का?"
          hi: "राष्ट्रीय आय-सह-योग्यता छात्रवृत्ति को छोड़कर, क्या आपको केंद्र द्वारा वित्तपोषित कोई अन्य मैट्रिक-पूर्व छात्रवृत्ति मिल रही है?"

  # Which papers she actually has. A fact is attributed to one of these when the corpus
  # accepts it as proof for that clause; otherwise the fact stands only as her word.
  - section_id: documents
    verticals: [entrepreneur, welfare, student]
    title:
      en: "Which of these do you have with you?"
      mr: "यांपैकी कोणती कागदपत्रे तुमच्याकडे आहेत?"
      hi: "इनमें से कौन से दस्तावेज़ आपके पास हैं?"
    questions:
      - question_id: documents_held
        type: documents
        prompt:
          en: "Tick every document you can produce."
          mr: "तुम्ही दाखवू शकाल अशा प्रत्येक कागदपत्रावर खूण करा."
          hi: "आप जो भी दस्तावेज़ दिखा सकते हैं, उन सब पर निशान लगाएं."
        documents:
          - aadhaar
          - age_proof
          - caste_certificate
          - husband_death_certificate
          - divorce_decree
          - bpl_ration_card
          - income_certificate
          - land_record_7_12
          - bank_passbook
          - project_report
          - pension_order
          - bonafide_certificate
          - admission_letter
          - school_id_card
