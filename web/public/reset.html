<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Haqdaar on this device</title>
<!--
  A self-healing page, deliberately plain HTML with no build step and no imports.

  WHY THIS EXISTS
  A service worker that has cached an old app shell can keep serving it after a deploy,
  and if that stale HTML points at asset filenames the new deploy replaced, the page
  renders white and NO APPLICATION CODE RUNS. Nothing inside the React app can fix
  that, because none of it executes. The usual answer is to talk someone through
  DevTools on every device, which is not an answer at a demo.

  This page is reachable because the service worker handles navigations network-first,
  so a navigation to /reset.html is fetched fresh even while the old worker controls
  the site. From here it can unregister every worker and delete every cache.

  Keep it dependency-free. It has to work when everything else is broken.
-->
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #faf8f5; color: #0f172a;
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
  }
  @media (prefers-color-scheme: dark) { body { background: #0b1220; color: #e6edf7; } }
  main { max-width: 34rem; }
  h1 { font-size: 1.5rem; margin: 0 0 12px; }
  p { margin: 0 0 14px; }
  #log {
    font: 13px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace;
    white-space: pre-wrap; padding: 14px; border-radius: 12px;
    background: rgba(127,127,127,.12);
  }
  a.btn {
    display: inline-block; margin-top: 18px; padding: 12px 18px; border-radius: 10px;
    background: #000080; color: #fff; text-decoration: none; font-weight: 600;
  }
  @media (prefers-color-scheme: dark) { a.btn { background: #8494e0; color: #0b1220; } }
</style>
</head>
<body>
<main>
  <h1>Resetting Haqdaar on this device</h1>
  <p>Clearing the stored copy of the app. This affects only this browser.</p>
  <div id="log">working…</div>
  <a class="btn" href="/">Open Haqdaar</a>
</main>
<script>
(function () {
  var out = [];
  var el = document.getElementById('log');
  function say(line) { out.push(line); el.textContent = out.join('\n'); }

  var jobs = [];

  if ('serviceWorker' in navigator) {
    jobs.push(
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        if (!regs.length) { say('service workers: none registered'); return; }
        return Promise.all(regs.map(function (r) { return r.unregister(); }))
          .then(function () { say('service workers: unregistered ' + regs.length); });
      }).catch(function (e) { say('service workers: could not read (' + e.message + ')'); })
    );
  } else {
    say('service workers: not supported here');
  }

  if (window.caches && caches.keys) {
    jobs.push(
      caches.keys().then(function (keys) {
        if (!keys.length) { say('caches: none'); return; }
        return Promise.all(keys.map(function (k) { return caches.delete(k); }))
          .then(function () { say('caches: deleted ' + keys.join(', ')); });
      }).catch(function (e) { say('caches: could not clear (' + e.message + ')'); })
    );
  } else {
    say('caches: not supported here');
  }

  Promise.all(jobs).then(function () {
    say('');
    say('Done. Open Haqdaar below, and if it still looks wrong, reload once more.');
  });
})();
</script>
</body>
</html>
