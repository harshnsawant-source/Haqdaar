[project]
name = "haqdaar"
version = "0.1.0"
description = "Haqdaar engine — grounded, refusing, deterministic scheme eligibility."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.12",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["haqdaar*"]

[tool.pytest.ini_options]
# pythonpath lets `pytest engine/tests` work from the repo root with no install step.
pythonpath = ["."]
testpaths = ["tests"]
