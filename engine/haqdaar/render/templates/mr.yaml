# Marathi output templates.
#
# STATUS: DRAFTED 2026-08-26, AWAITING NATIVE-SPEAKER REVIEW.
#
# These are a first pass, not verified translations. They were written to be reviewed
# line by line by someone who reads Marathi, and `docs/TRANSLATION-REVIEW.md` is the
# sheet for doing that. Until every line is signed off, treat any Marathi on screen as
# a draft and say so if a judge asks.
#
# Why this matters more here than in most products: a mistranslated eligibility rule
# sends a real person to an office to be turned away, which is precisely the harm this
# whole system exists to prevent. Being wrong in Marathi is not a cosmetic bug.
#
# RULES FOR ANYONE EDITING THIS FILE (enforced by tests, not manners):
#
# 1. NO DIGITS ANYWHERE, and that includes Devanagari numerals (० १ २ ३ ...). The
#    build-time audit matches them exactly like ASCII digits. Every number a citizen
#    reads must arrive through a {slot} that traces back to a predicate.
# 2. KEEP EVERY {slot} EXACTLY AS WRITTEN, in the same set as the English line. A
#    dropped slot renders a sentence with its fact missing; a test catches it.
# 3. NO HEDGING. The Marathi must not soften a refusal into "maybe". If we cannot
#    prove it we refuse, in every language.
# 4. Translate the MEANING, not the word order. Several of these are deliberately
#    blunt in English ("Stop.", "I will not guess"). Keep that register.

# --- ELIGIBLE ---------------------------------------------------------------
eligible.headline: "तुम्ही {scheme_name} साठी पात्र आहात."
eligible.proof_intro: "तुम्हाला हा हक्क देणारा नियम असा आहे:"
eligible.proof_line: "{clause_text}"
eligible.proof_source: "स्रोत: {source_url}"
eligible.evidence_line: "तुमच्या {document} वरून हे सिद्ध झाले."
eligible.next_step: "{filing_office} येथे अर्ज करा."

# --- NOT_ELIGIBLE -----------------------------------------------------------
not_eligible.headline: "ही योजना तुमच्यासाठी नाही, आणि त्याचे नेमके कारण असे आहे."
not_eligible.reason: "नियम सांगतो {bound_text}. तुमचे {field_label} आहे {value}."
not_eligible.reason_required: "यासाठी {field_label} आवश्यक आहे. तुम्ही सांगितले {value}."
not_eligible.reason_excluded: "{field_label} असल्यास ही योजना मिळत नाही. तुम्ही सांगितले {value}."
not_eligible.becomes_eligible: "{year} साली तुम्ही पात्र व्हाल."

# --- BLOCKED_ON_DOCUMENT ----------------------------------------------------
blocked.headline: "फक्त एक कागदपत्र कमी आहे."
blocked.single: "तुमचा {document} आणा, त्यामुळे {scheme_name} मिळू शकेल."
blocked.multiple: "तुमचा {document} आणा, त्यामुळे आणखी {count} योजना मिळू शकतील."
blocked.where: "तो तुम्हाला {office} येथून मिळेल."
blocked.rule: "हा नियम त्यामुळे पूर्ण होतो: {clause_text}"

# --- UNVERIFIABLE (T1 / T3) -------------------------------------------------
unverifiable.headline: "याची खात्री मी करू शकत नाही, आणि मी अंदाज लावणार नाही."
unverifiable.reason_dataset: >-
  या योजनेचा नियम अशा नोंदींवर अवलंबून आहे ज्या मी तपासू शकत नाही, आणि तुम्ही
  दाखवलेल्या कोणत्याही कागदपत्रावरून तो सिद्ध होत नाही.
unverifiable.reason_discretionary: "तो निर्णय {decider} घेतात, कोणतेही कागदपत्र नाही."
unverifiable.rule: "जो नियम मी ठरवू शकत नाही: {clause_text}"
unverifiable.also_unsettleable: >-
  याच नोंदींवर या योजनेतील आणखी {count} अटी अवलंबून आहेत, आणि त्यांपैकी एकही मी
  तपासू शकत नाही.
unverifiable.next_step: "{office} येथे विचारा आणि तोच नियम सांगा."
unverifiable.promise: "त्यांनी खात्री दिली तर परत या, मी तुमचा अर्ज पूर्ण करेन."
unverifiable.outside_corpus: >-
  त्याबाबतचे नियम माझ्याकडे नाहीत. जिथे मी तुम्हाला अधिकृत तरतूद दाखवू शकतो
  तिथेच मी उत्तर देतो.

# --- SCHEME WINDOW (T6) -----------------------------------------------------
window.lapsed_headline: "थांबा. या योजनेला मंजूर असलेला कालावधी संपला आहे."
window.lapsed_reason: "माझ्याकडील नियम {valid_until} पर्यंतचे आहेत."
window.lapsed_source: "अधिकृत कागदपत्रात असे म्हटले आहे: {validity_text}"
window.lapsed_proof_kept: >-
  तरीही मी तुम्हाला या योजनेच्या जाहीर नियमांनुसार खाली तपासले आहे. यावर वेळ
  घालवण्यापूर्वी तिच्या जागी नवी योजना आली आहे का, हे कार्यालयात विचारून घ्या.
window.not_yet_open_headline: "ही योजना अद्याप सुरू झालेली नाही."
window.not_yet_open_reason: "ती {valid_from} रोजी सुरू होते."

# --- APPROVAL (reported beside eligibility, never instead of it) ------------
approval.headline: "मंजुरी मिळेल का, याचे वचन देणे माझ्या हातात नाही."
approval.refusal: "तो निर्णय {decider} घेतात, आणि तुमच्याकडील कोणतेही कागदपत्र तो ठरवत नाही."
approval.rule: "अट अशी आहे: {clause_text}"

# --- STALENESS (T5) — flags the answer, never suppresses it ----------------
staleness.banner: >-
  हा नियम शेवटचा {retrieved_on} रोजी तपासला होता. त्यावर अवलंबून राहण्यापूर्वी तो
  आजही लागू आहे का, याची खात्री करा.
staleness.amended: "मी वाचल्यानंतर {last_amended} रोजी स्रोतामध्ये बदल नोंदवला गेला आहे."

# --- PROVENANCE, shown on every card ----------------------------------------
source.checked: "अधिकृत स्रोताशी {retrieved_on} रोजी पडताळून पाहिले."

# --- PROVISIONAL corpus warning --------------------------------------------
provisional.banner: >-
  हा नियम अद्याप अधिकृत स्रोताशी पडताळलेला नाही. त्यावर कृती करणे सुरक्षित नाही.

# --- GUIDED INTAKE ----------------------------------------------------------
intake.declared_banner: >-
  हे तुम्ही मला जे सांगितले त्यावर आधारित आहे. मी तुमची कागदपत्रे पाहिलेली नाहीत,
  त्यामुळे ज्यासाठी दाखला लागतो ते अजूनही बाकी म्हणून दाखवले आहे.

# --- A+ ACTION LAYER --------------------------------------------------------
action.headline: "{scheme_name} साठी तुमच्या कागदपत्रांवरून जे सिद्ध होते ते मी भरले आहे."
action.simulated_banner: >-
  ही केवळ नक्कल आहे. कोणत्याही सरकारी संकेतस्थळावर काहीही पाठवलेले नाही, आणि हा
  संदर्भ क्रमांक याच उपकरणावर तयार झाला आहे. हा अर्ज नाही.
action.stand_in_banner: >-
  ही केवळ नक्कल असलेली अर्जाची रचना आहे. हा आम्ही तयार केलेला नमुना आहे, अधिकृत
  अर्ज नाही.
action.filled_count: "तुमच्या कागदपत्रांवरून {count} रकाने भरले."
action.gap_intro: "हे अजून तुम्हाला द्यावे लागेल:"
action.gap_line: "{label}"
action.gap_document: "तुमचा {document} आणा, त्यातून यांपैकी {count} मिळतील."
action.complete: "हा अर्ज जे मागतो त्यातले काहीही बाकी नाही."
action.tracking: "तुमचा नक्कल संदर्भ क्रमांक: {reference}"
action.approval_pending: >-
  अर्ज दाखल करणे म्हणजे मंजुरी नव्हे. तो निर्णय {decider} घेतात.
